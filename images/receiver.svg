<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 430" width="800" height="430" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A TSOP4838 infrared receiver wired to a Raspberry Pi header</title>
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e6b45" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#1e6b45"/>
      <stop offset="1" stop-color="#17583a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1d77e"/>
      <stop offset="1" stop-color="#b98f2a"/>
    </linearGradient>
    <radialGradient id="dome" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#6b7177"/>
      <stop offset="0.35" stop-color="#34383c"/>
      <stop offset="1" stop-color="#141617"/>
    </radialGradient>
    <g id="pin">
      <rect x="-8" y="-8" width="16" height="16" rx="2" fill="url(#gold)"/>
      <rect x="-3.5" y="-3.5" width="7" height="7" rx="1" fill="#8a6a1c"/>
    </g>
  </defs>

  <rect x="1" y="1" width="798" height="428" rx="14" fill="#fbfaf7" stroke="#e3dfd5" stroke-width="2"/>

  <text x="40" y="46" font-size="22" font-weight="700" fill="#22272b">Infrared receiver</text>
  <text x="40" y="70" font-size="14" fill="#5c646b">A TSOP4838, facing its dome.  Looking down on the Pi, with the header's edge nearest you.</text>

  <!-- the receiver -->
  <text x="470" y="98" font-size="12" fill="#7a8288" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">TSOP4838</text>
  <g stroke="#a8adb3" stroke-width="4" stroke-linecap="round">
    <line x1="440" y1="170" x2="440" y2="198"/>
    <line x1="470" y1="170" x2="470" y2="198"/>
    <line x1="500" y1="170" x2="500" y2="198"/>
  </g>
  <rect x="422" y="106" width="96" height="68" rx="9" fill="#1d1f21"/>
  <circle cx="470" cy="140" r="23" fill="url(#dome)"/>
  <ellipse cx="462" cy="131" rx="7" ry="4" fill="#ffffff" fill-opacity="0.35"/>

  <!-- which leg is which -->
  <g font-size="14" fill="#22272b">
    <rect x="574" y="112" width="22" height="6" rx="3" fill="#0f8b8d"/>
    <text x="606" y="120"><tspan font-weight="700">output</tspan>  pin 12, GPIO18</text>
    <rect x="574" y="138" width="22" height="6" rx="3" fill="#30363b"/>
    <text x="606" y="146"><tspan font-weight="700">ground</tspan>  pin 9</text>
    <rect x="574" y="164" width="22" height="6" rx="3" fill="#e03131"/>
    <text x="606" y="172"><tspan font-weight="700">power</tspan>  pin 1, 3.3V</text>
  </g>

  <!-- the board, and the header on it -->
  <rect x="60" y="240" width="680" height="146" fill="url(#board)"/>
  <line x1="60" y1="386" x2="740" y2="386" stroke="#0f3d27" stroke-width="3"/>
  <rect x="125" y="272" width="494" height="86" rx="5" fill="#161718"/>

  <g>
    <use xlink:href="#pin" href="#pin" x="600" y="296"/>
    <use xlink:href="#pin" href="#pin" x="562" y="296"/>
    <use xlink:href="#pin" href="#pin" x="524" y="296"/>
    <use xlink:href="#pin" href="#pin" x="486" y="296"/>
    <use xlink:href="#pin" href="#pin" x="448" y="296"/>
    <use xlink:href="#pin" href="#pin" x="410" y="296"/>
    <use xlink:href="#pin" href="#pin" x="372" y="296"/>
    <use xlink:href="#pin" href="#pin" x="334" y="296"/>
    <use xlink:href="#pin" href="#pin" x="296" y="296"/>
    <use xlink:href="#pin" href="#pin" x="258" y="296"/>
    <use xlink:href="#pin" href="#pin" x="220" y="296"/>
    <use xlink:href="#pin" href="#pin" x="182" y="296"/>
    <use xlink:href="#pin" href="#pin" x="144" y="296"/>
    <use xlink:href="#pin" href="#pin" x="600" y="334"/>
    <use xlink:href="#pin" href="#pin" x="562" y="334"/>
    <use xlink:href="#pin" href="#pin" x="524" y="334"/>
    <use xlink:href="#pin" href="#pin" x="486" y="334"/>
    <use xlink:href="#pin" href="#pin" x="448" y="334"/>
    <use xlink:href="#pin" href="#pin" x="410" y="334"/>
    <use xlink:href="#pin" href="#pin" x="372" y="334"/>
    <use xlink:href="#pin" href="#pin" x="334" y="334"/>
    <use xlink:href="#pin" href="#pin" x="296" y="334"/>
    <use xlink:href="#pin" href="#pin" x="258" y="334"/>
    <use xlink:href="#pin" href="#pin" x="220" y="334"/>
    <use xlink:href="#pin" href="#pin" x="182" y="334"/>
    <use xlink:href="#pin" href="#pin" x="144" y="334"/>
  </g>

  <!-- pin numbers: odd on the inner row, even on the edge row -->
  <g font-size="11" fill="#e4f1e8" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">
    <text x="606" y="266" font-weight="700" fill="#ffffff" text-anchor="start">1</text>
    <text x="562" y="266">3</text><text x="524" y="266">5</text>
    <text x="486" y="266">7</text>
    <text x="454" y="266" font-weight="700" fill="#ffffff" text-anchor="start">9</text>
    <text x="410" y="266">11</text><text x="372" y="266">13</text>
    <text x="334" y="266">15</text><text x="296" y="266">17</text>
    <text x="258" y="266">19</text><text x="220" y="266">21</text>
    <text x="182" y="266">23</text><text x="144" y="266">25</text>
    <text x="600" y="376">2</text><text x="562" y="376">4</text>
    <text x="524" y="376">6</text><text x="486" y="376">8</text>
    <text x="448" y="376">10</text>
    <text x="410" y="376" font-weight="700" fill="#ffffff">12</text>
    <text x="372" y="376">14</text><text x="334" y="376">16</text>
    <text x="296" y="376">18</text><text x="258" y="376">20</text>
    <text x="220" y="376">22</text><text x="182" y="376">24</text>
    <text x="144" y="376">26</text>
  </g>
  <text x="632" y="301" font-size="13" fill="#ffffff">&#8592; pin 1</text>
  <text x="740" y="404" font-size="12" font-style="italic" fill="#7a8288" text-anchor="end">edge of the board</text>

  <!-- the wires: output runs down between pins 11 and 13 to the edge row -->
  <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M500 198 V232 H600 V296" stroke="#e03131"/>
    <path d="M470 198 V220 H448 V296" stroke="#30363b"/>
    <path d="M440 198 V210 H391 V315 H410 V334" stroke="#0f8b8d"/>
  </g>
  <g fill="none" stroke-width="3">
    <rect x="591" y="287" width="18" height="18" rx="3" stroke="#e03131"/>
    <rect x="439" y="287" width="18" height="18" rx="3" stroke="#9aa3aa"/>
    <rect x="401" y="325" width="18" height="18" rx="3" stroke="#0f8b8d"/>
  </g>
</svg>
