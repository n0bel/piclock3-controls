<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 450" width="800" height="450" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Three push buttons wired to a Raspberry Pi header</title>
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e6b45" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#1e6b45"/>
      <stop offset="1" stop-color="#17583a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1d77e"/>
      <stop offset="1" stop-color="#b98f2a"/>
    </linearGradient>
    <radialGradient id="cap" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <g id="pin">
      <rect x="-8" y="-8" width="16" height="16" rx="2" fill="url(#gold)"/>
      <rect x="-3.5" y="-3.5" width="7" height="7" rx="1" fill="#8a6a1c"/>
    </g>
    <g id="button">
      <rect x="-27" y="-27" width="54" height="54" rx="7" fill="#2c3135"/>
      <rect x="-22" y="-22" width="44" height="44" rx="5" fill="#3a4045"/>
      <circle cx="-18" cy="-18" r="2" fill="#5b6268"/>
      <circle cx="18" cy="-18" r="2" fill="#5b6268"/>
      <circle cx="-18" cy="18" r="2" fill="#5b6268"/>
      <circle cx="18" cy="18" r="2" fill="#5b6268"/>
    </g>
  </defs>

  <rect x="1" y="1" width="798" height="448" rx="14" fill="#fbfaf7" stroke="#e3dfd5" stroke-width="2"/>

  <text x="40" y="46" font-size="22" font-weight="700" fill="#22272b">Buttons</text>
  <text x="40" y="70" font-size="14" fill="#5c646b">Each one connects its pin to ground when pressed.  Looking down on the Pi, with the header's edge nearest you.</text>

  <!-- the board, and the header on it -->
  <rect x="60" y="86" width="680" height="146" fill="url(#board)"/>
  <line x1="60" y1="232" x2="740" y2="232" stroke="#0f3d27" stroke-width="3"/>
  <rect x="125" y="118" width="494" height="86" rx="5" fill="#161718"/>

  <g>
    <use xlink:href="#pin" href="#pin" x="600" y="142"/>
    <use xlink:href="#pin" href="#pin" x="562" y="142"/>
    <use xlink:href="#pin" href="#pin" x="524" y="142"/>
    <use xlink:href="#pin" href="#pin" x="486" y="142"/>
    <use xlink:href="#pin" href="#pin" x="448" y="142"/>
    <use xlink:href="#pin" href="#pin" x="410" y="142"/>
    <use xlink:href="#pin" href="#pin" x="372" y="142"/>
    <use xlink:href="#pin" href="#pin" x="334" y="142"/>
    <use xlink:href="#pin" href="#pin" x="296" y="142"/>
    <use xlink:href="#pin" href="#pin" x="258" y="142"/>
    <use xlink:href="#pin" href="#pin" x="220" y="142"/>
    <use xlink:href="#pin" href="#pin" x="182" y="142"/>
    <use xlink:href="#pin" href="#pin" x="144" y="142"/>
    <use xlink:href="#pin" href="#pin" x="600" y="180"/>
    <use xlink:href="#pin" href="#pin" x="562" y="180"/>
    <use xlink:href="#pin" href="#pin" x="524" y="180"/>
    <use xlink:href="#pin" href="#pin" x="486" y="180"/>
    <use xlink:href="#pin" href="#pin" x="448" y="180"/>
    <use xlink:href="#pin" href="#pin" x="410" y="180"/>
    <use xlink:href="#pin" href="#pin" x="372" y="180"/>
    <use xlink:href="#pin" href="#pin" x="334" y="180"/>
    <use xlink:href="#pin" href="#pin" x="296" y="180"/>
    <use xlink:href="#pin" href="#pin" x="258" y="180"/>
    <use xlink:href="#pin" href="#pin" x="220" y="180"/>
    <use xlink:href="#pin" href="#pin" x="182" y="180"/>
    <use xlink:href="#pin" href="#pin" x="144" y="180"/>
  </g>

  <!-- pin numbers: odd on the inner row, even on the edge row -->
  <g font-size="11" fill="#e4f1e8" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">
    <text x="600" y="112">1</text><text x="562" y="112">3</text>
    <text x="524" y="112">5</text><text x="486" y="112">7</text>
    <text x="448" y="112">9</text><text x="410" y="112">11</text>
    <text x="372" y="112">13</text><text x="334" y="112">15</text>
    <text x="296" y="112">17</text><text x="258" y="112">19</text>
    <text x="220" y="112">21</text><text x="182" y="112">23</text>
    <text x="144" y="112">25</text>
    <text x="600" y="222">2</text><text x="562" y="222">4</text>
    <text x="524" y="222">6</text><text x="486" y="222">8</text>
    <text x="448" y="222">10</text><text x="410" y="222">12</text>
    <text x="372" y="222">14</text>
    <g font-weight="700" fill="#ffffff" text-anchor="start">
      <text x="340" y="222">16</text>
      <text x="302" y="222">18</text>
      <text x="264" y="222">20</text>
      <text x="226" y="222">22</text>
    </g>
    <text x="182" y="222">24</text><text x="144" y="222">26</text>
  </g>
  <text x="632" y="147" font-size="13" fill="#ffffff">&#8592; pin 1</text>
  <text x="740" y="250" font-size="12" font-style="italic" fill="#7a8288" text-anchor="end">edge of the board</text>

  <!-- the wires -->
  <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M258 180 V412" stroke="#30363b"/>
    <path d="M170 412 H640" stroke="#30363b"/>
    <path d="M220 180 V266 H170 V318" stroke="#7b4fc9"/>
    <path d="M296 180 V282 H430 V318" stroke="#e07a1f"/>
    <path d="M334 180 V258 H640 V318" stroke="#0f8b8d"/>
    <path d="M170 372 V412 M430 372 V412 M640 372 V412" stroke="#30363b"/>
  </g>
  <g fill="#30363b">
    <circle cx="170" cy="412" r="5"/>
    <circle cx="258" cy="412" r="5"/>
    <circle cx="430" cy="412" r="5"/>
    <circle cx="640" cy="412" r="5"/>
  </g>
  <!-- where each wire lands on its pin -->
  <g fill="none" stroke-width="3">
    <rect x="325" y="171" width="18" height="18" rx="3" stroke="#0f8b8d"/>
    <rect x="287" y="171" width="18" height="18" rx="3" stroke="#e07a1f"/>
    <rect x="249" y="171" width="18" height="18" rx="3" stroke="#9aa3aa"/>
    <rect x="211" y="171" width="18" height="18" rx="3" stroke="#7b4fc9"/>
  </g>

  <!-- the buttons -->
  <use xlink:href="#button" href="#button" x="170" y="345"/>
  <circle cx="170" cy="345" r="14" fill="#7b4fc9"/>
  <circle cx="170" cy="345" r="14" fill="url(#cap)"/>
  <use xlink:href="#button" href="#button" x="430" y="345"/>
  <circle cx="430" cy="345" r="14" fill="#e07a1f"/>
  <circle cx="430" cy="345" r="14" fill="url(#cap)"/>
  <use xlink:href="#button" href="#button" x="640" y="345"/>
  <circle cx="640" cy="345" r="14" fill="#0f8b8d"/>
  <circle cx="640" cy="345" r="14" fill="url(#cap)"/>

  <!-- what each one does -->
  <g font-size="15" font-weight="700" fill="#22272b">
    <text x="130" y="341" text-anchor="end">slideshow-hold</text>
    <text x="470" y="341">previous-page</text>
    <text x="680" y="341">next-page</text>
  </g>
  <g font-size="12" fill="#5c646b" font-family="ui-monospace, Consolas, monospace">
    <text x="130" y="360" text-anchor="end">gpio-25 &#183; pin 22</text>
    <text x="470" y="360">gpio-24 &#183; pin 18</text>
    <text x="680" y="360">gpio-23 &#183; pin 16</text>
    <text x="268" y="402">ground &#183; pin 20</text>
  </g>
</svg>
